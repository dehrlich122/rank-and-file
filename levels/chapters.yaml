# Chapter list, in play order. Each chapter's levels live in levels/chNN/
# (levels/practice/ for the Testing ground).
- chapter: 1
  title: First Moves
  tier: pawn
  summary: Calling functions, arguments, sequencing, comments and print().
- chapter: 2
  title: Counting Steps
  tier: pawn
  summary: Variables, whole numbers, arithmetic and f-strings, and a pawn that can count.
- chapter: 3
  title: Marching Orders
  tier: pawn
  summary: for loops and range(), the loop's variable, loops inside loops, and clockwork that counts your lines.
- chapter: 4
  title: Eyes Open
  tier: pawn
  summary: True and False, comparisons, if, elif and else, and a pawn that looks before it steps.
- chapter: 5
  title: Keep Going
  tier: pawn
  summary: while loops, a counter kept inside one, break and continue, and a pawn that goes on until it's done.
- chapter: 6
  title: Runes
  tier: pawn
  summary: Reading runes, text as characters, slices and methods, asking text questions with in, and turning text into numbers and routes.
- chapter: 0
  title: Testing ground
  tier: practice
  curriculum: false # not numbered, and "Next level" never leads here
  summary: Levels for trying out game features before the chapters that use them. Not part of the curriculum.
