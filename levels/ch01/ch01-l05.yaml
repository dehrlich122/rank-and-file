id: ch01-l05
chapter: 1
title: The Winding Path
trains: "Chapter review: calls, arguments and sequencing together"
brief: A long, winding path, and exactly enough lines to walk it if you plan well.
piece: pawn
map: |
  # . . . . G
  # . # # # #
  # . # # # #
  # . . . # #
  # # # . # #
  P . . . # #
start: {facing: east}
objectives: [reach_goal]
api: [move, turn_left, turn_right]
constraints: {max_lines: 9}
par: {lines: 9}
hints:
  - Break the path into straight pieces. How many straights and how many corners are there?
  - Each straight piece can be a single line if you give move() an argument.
  - "Write the plan as comments first (# east 3, # turn ...), then turn each comment into code. Comments don't count as lines."
