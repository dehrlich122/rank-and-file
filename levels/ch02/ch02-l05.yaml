hints:
- "Watch the gate's badge during a run: it counts every tick, and every square walked and every tick waited is one."
- "% gives the remainder: with a gate that repeats every 4 ticks, ticks % 4 says where in its cycle you are. The gate opens again when that remainder is 0."
- "One way to write the line that matters most: `pawn.wait(4 - ahead % 4)`"
