hints:
- "The halls and galleries are different on every board, so no number you type fits them all. Let your pawn do the counting."
- "pawn.squares_ahead() gives back a number you can use straight away or keep in a name. // divides and drops the remainder: 7 // 2 is 3."
- "One way to write the line that matters most: `pawn.move(pawn.squares_ahead() // 2)`"
