hints:
- "The runerf are untidy in different ways. A text can be copied and tidied, and the original is never changed."
- "Methods are called on text with a dot. One removes spaces from both ends, one makes capitals, one makes small letters, and one swaps one piece of text for another. A method returns a new text, so a second method can follow the first."
- "Here is the line that reads the rune:\ntext = pawn.read().strip()"
