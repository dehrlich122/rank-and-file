hints:
- "The examiner hands over places, and jump() wants a jump. Where is your knight standing when it needs the next one?"
- "A for loop can unpack each pair into two names. knight.position is a pair too: where the knight stands now. A jump is the difference between two places: how far right from here to there, and how far up."
- "Two names for each pair, and two more for where the knight stands:\nfor x, y in stops:\n    here_x, here_y = knight.position\n    knight.jump(x - ..., y - ...)"
