start: {"facing": "north"}
api: ["jump", "pick_up", "inventory"]
par: {"lines": 12}
hints:
- "Pick up both keys first. Which door to take is a question only the satchel can answer, and the answer differs from board to board."
- "knight.inventory is a list of the keys picked up so far, by name. in asks whether a value is in a list, and gives True or False, so it can stand in an if. Ask about one door's key: take that door if it is there, the other door if it isn't."
- "Ask the satchel, then choose:\nif \"brass\" in knight.inventory:\n    ...\nelse:\n    ..."
