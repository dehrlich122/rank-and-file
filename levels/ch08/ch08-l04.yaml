hints:
- "The runes come first and the ladder after them, so the numbers have to be kept. How many names would that take, and how many lines?"
- "Start with an empty list before the loop. On each rune stone, add its number to the end of the list with append: one line, however many runes there are. Turn the rune's text into a number first. After the last rune the list is the ladder's route: loop over it."
- "Build the list, then use it:\nroute = []\nfor i in range(...):\n    ...\n    route.append(...)\nfor side in route:\n    ..."
