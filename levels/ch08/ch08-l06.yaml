hints:
- "The examiner names the hub first, then where the keys lie. Every key is one jump from the hub: out, pick it up, and back."
- "Unpack the hub into two names, and jump there from where the knight stands. Then loop over the places with two names: a jump is the difference between two places, there and back. When the loop is done, the satchel holds every key: hand back its numbers in order, as a list."
- "The loop, and the answer:\n    for x, y in places:\n        knight.jump(x - hub_x, y - hub_y)\n        ...\n    return sorted(...)"
