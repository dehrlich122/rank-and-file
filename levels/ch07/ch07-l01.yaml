hints:
- "Follow the stones. Each jump has to land on the next one: the pits are a fall, and the wall is only in the way of a pawn."
- "The first number of a jump is how far right, the second how far up; a minus goes left or down. Look for the pair of jumps that comes again and again on the path: a for loop can repeat it."
- "One way to start:\nknight.jump(-2, -1)"
