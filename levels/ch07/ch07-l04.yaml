hints:
- "The number is written on the rune, and it is different on every board. Your knight has to land on the rune to read it."
- "return hands a value back to whoever called the function, and ends the function right there. Printing only shows a value on the screen. The rune gives text, and the examiner wants a number. The goal is one jump past the rune, so keep the number in a name until the last jump is done."
- "Keep the answer, finish the move, then hand it back:\n    number = int(knight.read())\n    knight.jump(...)\n    return number"
