hints:
- "The same figure of jumps comes three times on this board. Find it in the stones before you write a line."
- "def gives a name to some lines: the lines indented under it are the function's body. Defining runs nothing. The body runs each time you call the name, with parentheses. Put the figure in a function, and write only the jumps in between by hand."
- "A function, and two calls to it:\ndef figure():\n    knight.jump(...)\n    knight.jump(...)\n\nfigure()\nfigure()"
