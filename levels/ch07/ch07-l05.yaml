hints:
- "One function can cross any of the three bridges, if it is told how many stones the bridge has. What should it hand back?"
- "A name made inside a function lives only there, and starts fresh on every call. A function can read a name from outside, but it cannot change one: adding to an outside total from inside is an error. So add each toll to a name of the function's own, return it, and keep the total outside. Print the total on the stone beside the gate."
- "The function returns its own sum, and the program adds it to the total:\ntotal = cross(...)\ntotal += cross(...)"
