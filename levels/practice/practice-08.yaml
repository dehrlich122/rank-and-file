id: practice-08
chapter: 0
title: "The Toll"
trains: "A demo of gems and a guard who asks a question: nothing new to learn"
brief: "This level only tries out two mechanics: gems, collected by walking over them, and a guard who asks a question instead of wanting a passphrase. It teaches nothing beyond level 1.4. Both come into their own in later chapters, where the answer has to be worked out by the code as it runs."
piece: pawn
map: |
  # # # G
  # # # X
  $ . $ .
  $ # # #
  P # # #
legend:
  "$": "gem"
  "X": {"tile": "gate", "question": "How many gems did you collect?", "passphrase": "3"}
start: {"facing": "north"}
objectives:
- "reach_goal"
- {"collect": "all"}
api:
- move
- turn_left
- turn_right
par:
  lines: 6
hints:
- "Count the gems on your route as you plan it: that's the guard's answer."
- "The guard only hears you from a square next to the gate, so print the answer there."
- "One way to start: `pawn.move(2)`, then `pawn.turn_right()`."
lesson: practice/practice-08.md
lesson_board:
  map: |
    . . . . .
    P $ $ . X
  legend: {"$": "gem", "X": {"tile": "gate", "question": "How many gems did you collect?", "passphrase": "2"}}
  start: {"facing": "east"}
