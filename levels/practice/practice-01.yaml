id: practice-01
chapter: 0
title: Blindfold
trains: A while loop that stops when a condition is met
brief: 'Like a game of blindfold chess: you can''t see what you''re aiming for. The goal is on one of the squares marked ?.'
piece: pawn
map: |
  # ? #
  # . #
  # ? #
  # ? #
  # . #
  # ? #
  # . #
  # P #
start:
  facing: north
api:
- move
- at_goal
par:
  lines: 2
hints:
- The goal could be on any ? square, so a fixed number of steps can only ever be right for one of them.
- A while loop repeats while its condition is true. Which question can your pawn ask that tells it when to stop walking?
- '`while not pawn.at_goal():` then one indented line that takes a step.'
lesson: practice/practice-01.md
