hints:
- "The boards differ on the first jump. Your code can't know which board it is on until it looks."
- "knight.look(dx, dy) names what is on a landing square without jumping. Look at one of the two squares your first jump could land on, and let an if choose the jump. One test has to be right on every board."
- "One way to look before a jump:\nif knight.look(2, 1) == \"pit\":\n    knight.jump(1, 2)"
