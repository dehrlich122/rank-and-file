- "This row of pits can't be walked around. Is there anything on the board that could get you across?"
- "The plank is your way over. Walk across it to pick it up, and you can lay it over a pit as a bridge that you can walk on."
- "With the plank picked up, stand facing a pit and call `pawn.bridge()`. It lays the plank over the pit straight ahead, and `pawn.move()` then walks you onto it."
