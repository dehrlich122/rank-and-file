id: practice-07
chapter: 0
title: "Portcullis"
trains: "Counting ticks to arrive when a timed gate is open"
brief: "Two portcullises rise and fall on their own timers. Arrive at the right moment."
piece: pawn
map: |
  # # # # # G
  . . . . . U
  . # # # # .
  P . T . . .
legend:
  "T": {"tile": "timed_gate", "every": 3}
  "U": {"tile": "timed_gate", "every": 4}
start: {"facing": "east"}
api:
- move
- turn_left
- turn_right
- wait
par:
  lines: 6
hints:
- "A timed gate is open when the tick count is a multiple of its number. Count the ticks before you reach it."
- "Every square moved, every turn and every wait is a tick. `pawn.wait()` adds one without moving."
- "One way to start: `pawn.turn_left()`, then `pawn.move(2)`."
